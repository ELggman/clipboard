# Clipboard Workspace 默认配置（打包内置，禁止删除）
# 用户覆盖写入 config/settings.yaml，缺失字段回退本文件

app:
  theme: system            # system / light / dark
  font_size: 14            # 历史列表基准字号（12-16）
  launch_at_login: false   # 开机启动（写入 LaunchAgent）

history:
  max_items: 500           # 每会话历史数量上限（100 / 500 / 1000 / -1 无限）
  save_images: true
  auto_delete_days: 30     # 1 / 7 / 30 / 90 / 365 / -1(永不)
  poll_interval: 0.2       # 剪贴板轮询间隔（秒）
  show_image_filename: true  # 图片条目是否显示文件名（False 显示「时间 · image」）
  max_file_size_mb: 50     # 复制文档大小上限（MB，0 = 不限制）
  dedupe_scope: all        # 去重范围：all(全部会话，同内容全局去重) / session(仅本会话去重)

# Privacy Mode（§9）：敏感内容处理策略与来源应用排除
privacy:
  policy: warn             # warn(提醒,保存但遮蔽显示) / ignore(不保存) / save_temporarily(临时保存)
  temp_minutes: 5          # save_temporarily 的到期分钟数
  block_private_key: true  # 私钥类内容一律不保存（§9.15，默认建议 Do Not Save）
  paused: false            # 暂停监控（§9.3）：持久化，重启后保持暂停状态
  ignored_apps: []         # 来源应用排除列表（§9.5）。两种写法都支持，混用亦可：
                           #   - Code                      （旧格式：只按显示名匹配）
                           #   - {name: Code, bundle_id: com.microsoft.VSCode}
                           # 新格式额外记 bundle id——localizedName() 随系统语言变
                           # （中文系统下微信是「微信」），只存名字的话换个语言就漏记

# 会话（v4）：任务型内容分组。激活会话 = 新复制内容保存目标，重启恢复
session:
  active_id: 1             # 1 = 「普通」默认会话
  delete_policy: move      # 删除会话时：move(内容移回普通，合并去重) / delete(直接删除)

hotkey:
  enabled: true
  keycode: 9               # 物理键 vk 码：V = 9（不依赖键盘布局）
  flags: [command, shift]  # ⌘⇧V（Quick Paste）
  privacy_keycode: 35      # ⌘⇧P 隐私模式开关（P = 35）

# 模板模块（v6，原 snippet）：shortcut 触发的本地模板引擎
template:
  picker_keycode: 1             # ⌘⇧S 打开模板 Picker（S = 1）
  default_trigger_mode: tab     # tab(Tab 触发) / boundary(词边界触发)
  date_format: "%Y-%m-%d"
  time_format: "%H:%M"
  datetime_format: "%Y-%m-%d %H:%M:%S"
  extra_variables: []           # 用户自定义变量（结构化：{name, description, source, config}）
                                #   source: input(用户输入) / fixed(固定值) / command(外部命令) / state(系统状态)
  favorite_variables: null      # 常用变量（自动补全/变量区/「变量库」★ 管理）；null=默认全部预设

search:
  page_size: 100
